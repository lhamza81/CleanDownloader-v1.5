
name: Build VideoDownloaderPro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q VideoDownloaderPro-AndroidStudio-Project-v1.5-HLS-DASH-GitHub.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: VideoDownloaderPro
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: |
          echo "Available memory:"
          free -h

          gradle assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --console=plain

      - name: Verify APK
        run: |
          test -s VideoDownloaderPro/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderPro-debug-apk
          path: VideoDownloaderPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
