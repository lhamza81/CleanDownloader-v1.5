
name: Build VideoDownloaderPro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: 'platform-tools'

      - name: Find project ZIP
        id: project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p android-project
          unzip -q "${{ steps.project.outputs.zip_file }}" -d android-project

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          GRADLE_FILE=$(find android-project \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "ERROR: Gradle Wrapper (gradlew) is missing."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloaderPro-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
